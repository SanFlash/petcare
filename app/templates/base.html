<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152b"><title>{% block title %}PetCare{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap"><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head><body><div class="noise"></div><div class="cursor-glow"></div><header class="topbar glass"><a class="brand" href="/"><span class="brand-mark">🐾</span><span>PetCare</span></a><nav><a href="/">Home</a><a href="/dashboard">Dashboard</a><a href="/login">Login</a><a href="/register">Register</a><a href="/admin">Admin</a><button id="notificationBtn" class="icon-btn" title="Notifications">🔔<span id="notificationCount" class="count"></span></button><button id="logoutBtn" class="ghost">Logout</button></nav></header><main class="container">{% block content %}{% endblock %}</main><div id="toastStack" class="toast-stack"></div><div id="notificationPanel" class="notification-panel glass"><div class="section-head"><div><span class="eyebrow">LIVE CARE FEED</span><h3>Notifications</h3></div><button class="ghost" onclick="closeNotifications()">×</button></div><div id="notificationList"><p class="muted">Loading…</p></div></div><footer><strong>PetCare</strong> · Intelligent pet care companion · Tracking support, not veterinary diagnosis.</footer><script src="{{ url_for('static',filename='app.js') }}"></script></body></html>
