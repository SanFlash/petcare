{% extends "base.html" %}
{% block title %}Create account · PAWCARE 360{% endblock %}
{% block content %}<section class="auth-page auth-single"><div class="auth-card section-card"><div class="auth-icon"><i data-lucide="paw-print"></i></div><span class="eyebrow">GET STARTED</span><h1>Create your PAWCARE 360 account</h1><p class="muted">Build a trusted home for every pet record and reminder.</p><form id="registerForm"><label>Full name<input name="full_name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Owner phone<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="9876543210"></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn btn-primary">Create account <i data-lucide="arrow-right"></i></button><p id="formMessage" class="message"></p></form><p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p></div></section>{% endblock %}
